<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversation Review — 待办事项</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --accent-soft: #f3f4f6;
      --highlight: #2563eb;
      --done: #10b981;
      --done-bg: #f0fdf4;
      --done-text: #6b7280;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
      --font: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SF Mono", "Fira Code", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 120px;
    }

    /* Header */
    header {
      margin-bottom: 48px;
      text-align: center;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.875rem;
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 40px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .stat {
      text-align: center;
    }

    .stat .value {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--accent);
    }

    .stat .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Group */
    .group {
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }

    .group:hover {
      box-shadow: var(--shadow-md);
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .group-header:hover {
      background: var(--accent-soft);
    }

    .group-header h2 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-header .count {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .group-header .chevron {
      width: 20px;
      height: 20px;
      color: var(--muted);
      transition: transform 0.2s ease;
    }

    .group.collapsed .group-header .chevron {
      transform: rotate(-90deg);
    }

    .group-body {
      padding: 0 20px 16px;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s ease;
    }

    .group.collapsed .group-body {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
    }

    /* Todo item */
    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item:hover {
      background: var(--accent-soft);
      margin: 0 -20px;
      padding-left: 20px;
      padding-right: 20px;
      border-radius: var(--radius-sm);
    }

    .todo-checkbox {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-top: 2px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      background: var(--surface);
    }

    .todo-checkbox:hover {
      border-color: var(--highlight);
      background: #eff6ff;
    }

    .todo-checkbox.checked {
      background: var(--done);
      border-color: var(--done);
    }

    .todo-checkbox.checked svg {
      opacity: 1;
    }

    .todo-checkbox svg {
      width: 12px;
      height: 12px;
      color: white;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .todo-text {
      flex: 1;
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--text);
      cursor: default;
      padding: 2px 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
      min-height: 28px;
    }

    .todo-item.done .todo-text {
      color: var(--done-text);
      text-decoration: line-through;
      text-decoration-color: var(--done-text);
    }

    .todo-text:hover {
      background: var(--accent-soft);
    }

    .todo-text.editing {
      background: var(--surface);
      border: 1px solid var(--highlight);
      outline: none;
      cursor: text;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .todo-edit-hint {
      font-size: 0.6875rem;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.2s ease;
      margin-left: auto;
      flex-shrink: 0;
    }

    .todo-item:hover .todo-edit-hint {
      opacity: 1;
    }

    .todo-item.done .todo-edit-hint {
      opacity: 0;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* Footer */
    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.8;
    }

    footer a {
      color: var(--highlight);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    footer .source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    footer .divider {
      margin: 0 8px;
      color: var(--border);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .container {
        padding: 24px 16px 80px;
      }

      .stats {
        gap: 24px;
        padding: 16px;
      }

      .stat .value {
        font-size: 1.5rem;
      }

      .group-header {
        padding: 14px 16px;
      }

      .group-body {
        padding: 0 16px 14px;
      }

      .todo-item:hover {
        margin: 0 -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .group {
      animation: fadeIn 0.3s ease forwards;
    }

    .group:nth-child(2) { animation-delay: 0.05s; }
    .group:nth-child(3) { animation-delay: 0.1s; }
    .group:nth-child(4) { animation-delay: 0.15s; }
    .group:nth-child(5) { animation-delay: 0.2s; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Conversation Review</h1>
        <p>对话回顾 · 待办事项管理</p>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div id="groups"></div>

    <footer id="footer"></footer>
  </div>

  <script>
    window.__REVIEW_DATA__ = {"version": 1, "groups": [{"id": "20260801-182644", "timestamp": "2026-08-01T18:26:44+08:00", "title": "测试待办项", "todos": [{"id": "t-20260801-182644-001", "text": "验证脚本是否正常工作", "done": false}, {"id": "t-20260801-182644-002", "text": "检查数据存储位置", "done": false}]}]};

    const GIT_REPO = 'git@github.com:wangguoxi0814/conversation-review-skills.git';
    const GIT_URL = 'https://github.com/wangguoxi0814/conversation-review-skills';
    const STORAGE_PREFIX = 'cr_';

    // Storage helpers
    function getStorage(key, defaultVal) {
      try {
        const val = localStorage.getItem(STORAGE_PREFIX + key);
        return val !== null ? JSON.parse(val) : defaultVal;
      } catch {
        return defaultVal;
      }
    }

    function setStorage(key, val) {
      try {
        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val));
      } catch {}
    }

    // Format date
    function formatDate(iso) {
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // Create checkbox SVG
    function checkSvg() {
      return '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 5 9 10 3"></polyline></svg>';
    }

    // Render stats
    function renderStats(groups) {
      const totalTodos = groups.reduce((sum, g) => sum + g.todos.length, 0);
      const doneTodos = groups.reduce((sum, g) => sum + g.todos.filter(t => t.done).length, 0);
      const pendingTodos = totalTodos - doneTodos;

      document.getElementById('stats').innerHTML = `
        <div class="stat">
          <div class="value">${totalTodos}</div>
          <div class="label">总待办</div>
        </div>
        <div class="stat">
          <div class="value">${pendingTodos}</div>
          <div class="label">待完成</div>
        </div>
        <div class="stat">
          <div class="value">${doneTodos}</div>
          <div class="label">已完成</div>
        </div>
      `;
    }

    // Render groups
    function renderGroups(groups) {
      const container = document.getElementById('groups');

      if (!groups.length) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📝</div>
            <p>暂无待办事项</p>
            <p style="font-size: 0.8125rem; margin-top: 8px;">使用 /conversation-review 生成待办项</p>
          </div>
        `;
        return;
      }

      // Sort by timestamp descending
      const sorted = [...groups].sort((a, b) =>
        new Date(b.timestamp) - new Date(a.timestamp)
      );

      container.innerHTML = sorted.map((group, idx) => {
        const isCollapsed = getStorage(`collapsed_${group.id}`, idx !== 0);
        const doneCount = group.todos.filter(t => t.done).length;
        const totalCount = group.todos.length;

        return `
          <div class="group ${isCollapsed ? 'collapsed' : ''}" data-group-id="${group.id}">
            <div class="group-header" onclick="toggleGroup('${group.id}')">
              <h2>
                <span class="group-title">${group.title}</span>
                <span class="count">${doneCount}/${totalCount}</span>
              </h2>
              <svg class="chevron" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
              </svg>
            </div>
            <div class="group-body">
              <ul class="todo-list">
                ${group.todos.map(todo => renderTodoItem(group.id, todo)).join('')}
              </ul>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render single todo item
    function renderTodoItem(groupId, todo) {
      const done = getStorage(`done_${groupId}_${todo.id}`, todo.done);
      const text = getStorage(`text_${groupId}_${todo.id}`, todo.text);

      return `
        <li class="todo-item ${done ? 'done' : ''}" data-todo-id="${todo.id}">
          <div class="todo-checkbox ${done ? 'checked' : ''}" onclick="toggleDone('${groupId}', '${todo.id}')">
            ${checkSvg()}
          </div>
          <span class="todo-text" ondblclick="startEdit(this, '${groupId}', '${todo.id}')">${escapeHtml(text)}</span>
          <span class="todo-edit-hint">双击编辑</span>
        </li>
      `;
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Toggle group collapse
    function toggleGroup(groupId) {
      const group = document.querySelector(`.group[data-group-id="${groupId}"]`);
      const isCollapsed = group.classList.toggle('collapsed');
      setStorage(`collapsed_${groupId}`, isCollapsed);
    }

    // Toggle todo done
    function toggleDone(groupId, todoId) {
      const key = `done_${groupId}_${todoId}`;
      const current = getStorage(key, false);
      const newVal = !current;
      setStorage(key, newVal);

      // Update UI
      const item = document.querySelector(`.todo-item[data-todo-id="${todoId}"]`);
      item.classList.toggle('done', newVal);
      item.querySelector('.todo-checkbox').classList.toggle('checked', newVal);

      // Update group count
      updateGroupCount(groupId);
      renderStats(getGroups());
    }

    // Update group count display
    function updateGroupCount(groupId) {
      const group = document.querySelector(`.group[data-group-id="${groupId}"]`);
      const items = group.querySelectorAll('.todo-item');
      const done = group.querySelectorAll('.todo-item.done').length;
      const total = items.length;
      group.querySelector('.count').textContent = `${done}/${total}`;
    }

    // Start editing todo text
    function startEdit(el, groupId, todoId) {
      if (el.classList.contains('editing')) return;

      const originalText = el.textContent;
      el.classList.add('editing');
      el.contentEditable = true;
      el.focus();

      // Select all text
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      function finishEdit() {
        el.classList.remove('editing');
        el.contentEditable = false;
        const newText = el.textContent.trim();
        if (newText && newText !== originalText) {
          setStorage(`text_${groupId}_${todoId}`, newText);
        } else {
          el.textContent = originalText;
        }
      }

      el.addEventListener('blur', finishEdit, { once: true });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          el.blur();
        }
        if (e.key === 'Escape') {
          el.textContent = originalText;
          el.blur();
        }
      });
    }

    // Get groups from data
    function getGroups() {
      const store = window.__REVIEW_DATA__ || { groups: [] };
      return store.groups || [];
    }

    // Render footer
    function renderFooter() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;

      document.getElementById('footer').innerHTML = `
        <div>
          <span class="source">
            📦 Source: <a href="${GIT_URL}" target="_blank" rel="noopener">conversation-review-skills</a>
          </span>
          <span class="divider">·</span>
          <span>Generated: ${dateStr}</span>
        </div>
        <div style="margin-top: 4px; font-size: 0.6875rem; color: #9ca3af;">
          勾选状态保存在浏览器本地 · 清除浏览器数据将重置
        </div>
      `;
    }

    // Init
    function init() {
      const groups = getGroups();
      renderStats(groups);
      renderGroups(groups);
      renderFooter();
    }

    init();
  </script>
</body>
</html>
